name: Docs check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links-and-diagrams:
    name: Relative links and Mermaid diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check links and render diagrams
        run: node scripts/check-docs.mjs

  dco:
    name: Developer Certificate of Origin sign-off
    # Bots cannot certify the DCO; Dependabot action-pin updates are reviewed as PRs instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit in the PR carries a Signed-off-by trailer
        run: |
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$range")
          exit $missing
