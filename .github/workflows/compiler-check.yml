name: Compiler checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Native conformance (${{ matrix.arch }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Rust experiment builds and runs once per architecture.
          - runner: ubuntu-24.04
            arch: x86_64
            python: '3.11'
            native: false
          - runner: ubuntu-24.04
            arch: x86_64
            python: '3.12'
            native: true
          - runner: ubuntu-24.04-arm
            arch: aarch64
            python: '3.12'
            native: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify host and run all tests without skips
        env:
          TALVEN_EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          import unittest
          from talven.context import compiler_hash

          if platform.machine() != os.environ['TALVEN_EXPECT_ARCH']:
              raise SystemExit('Runner architecture does not match the declared test target')
          for tool in ('cc', 'nm', 'readelf', 'size'):
              if not shutil.which(tool):
                  raise SystemExit(f'CI requires {tool}; skipping native evidence is not allowed')
          evidence = {
              'system': platform.system(),
              'machine': platform.machine(),
              'python': platform.python_version(),
              'c_target': subprocess.check_output(['cc', '-dumpmachine'], text=True).strip(),
              'c_compiler': subprocess.check_output(['cc', '--version'], text=True).splitlines()[0],
              'compiler_hash': compiler_hash(),
          }
          print(json.dumps(evidence, sort_keys=True), flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          evidence.update(tests=result.testsRun, skipped=len(result.skipped), passed=result.wasSuccessful())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('```json\n' + json.dumps(evidence, indent=2, sort_keys=True) + '\n```\n')
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Check example formatting
        run: |
          for source in examples/*.tal examples/invalid/*.tal tests/fixtures/*.tal experiments/corpora/*/*.tal experiments/freestanding/*.tal; do
            python3 -m talven fmt "$source" --check --json
          done
      - name: Exercise provider-neutral evaluation without model calls
        run: |
          python3 tests/fixtures/eval_adapter.py --write-config build/eval-fixture.json
          python3 -m experiments run --adapter build/eval-fixture.json --out build/eval-smoke
          python3 -m experiments reverify build/eval-smoke --out build/eval-reverified.json
          python3 tests/fixtures/eval_borrow_adapter.py --write-config build/eval-borrow-fixture.json
          python3 -m experiments run --corpus m1c-borrowing-tasks-v1 --adapter build/eval-borrow-fixture.json --out build/eval-borrow-smoke
          python3 -m experiments reverify build/eval-borrow-smoke --out build/eval-borrow-reverified.json
      - name: Exercise Anthropic Messages fixtures without model calls
        run: |
          python3 experiments/adapters/anthropic_messages.py --fixture tests/fixtures/anthropic_messages.json --model fixture-messages-v1 --tokenizer 'fixture: no tokenizer' --write-config build/anthropic-fixture.json
          python3 -m experiments run --adapter build/anthropic-fixture.json --task strict-type --context both --max-repairs 1 --out build/anthropic-type
          python3 -m experiments reverify build/anthropic-type --out build/anthropic-type-reverified.json
          python3 -m experiments run --corpus m1c-borrowing-tasks-v1 --task borrow-permission --adapter build/anthropic-fixture.json --context both --max-repairs 1 --out build/anthropic-borrow
          python3 -m experiments reverify build/anthropic-borrow --out build/anthropic-borrow-reverified.json
      - name: Check native borrow lifetimes and ordering with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1
        run: python3 scripts/check-borrow-sanitizers.py
      - name: Build and execute the native CLI examples
        run: |
          python3 -m talven build examples/vectors.tal -o build/vectors
          ./build/vectors
          python3 -m talven build examples/borrowing.tal -o build/borrowing
          ./build/borrowing
          python3 -m talven build examples/scalars.tal -o build/scalars
          ./build/scalars
          python3 -m talven build examples/hello.tal --console -o build/hello
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['./build/hello'], capture_output=True, timeout=5)
          assert result.returncode == 0, result
          assert result.stdout == b'Hello, world!\n', result.stdout
          assert result.stderr == b'', result.stderr
          print('Hello World: exact stdout, empty stderr, exit 0')
          PY
      - name: Run explicit native and diagnostic test manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          result = subprocess.run(['python3', '-m', 'talven', 'test', 'examples/tests.json', '--json'],
                                  capture_output=True, timeout=240)
          destination = Path('build/native-tests.json')
          destination.parent.mkdir(exist_ok=True)
          destination.write_bytes(result.stdout)
          report = json.loads(result.stdout)
          assert result.returncode == 0, (result.returncode, result.stderr, report)
          assert report['complete'] and report['ok'], report
          assert report['schema'] == 'talven.test-report.v1', report
          assert report['profile'] == 'hosted-i32-tests-v1', report
          assert report['summary'] == {'passed': 7, 'failed': 0}, report
          print('Seven declared native/output/diagnostic cases passed')
          PY
      - name: Preserve native test receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tests-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/native-tests.json
          if-no-files-found: error
          retention-days: 30
      - name: Link and execute without libc or a heap allocator
        env:
          TALVEN_EXPECT_ARCH: ${{ matrix.arch }}
        run: python3 scripts/check-freestanding.py --expect-arch "$TALVEN_EXPECT_ARCH" --out build/freestanding-check
      - name: Build and verify the bounded native compiler experiment
        if: matrix.native
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          cargo +1.96.0 fmt --manifest-path experiments/native-compiler/Cargo.toml --check
          cargo +1.96.0 clippy --locked --offline --all-targets --manifest-path experiments/native-compiler/Cargo.toml -- -D warnings
          cargo +1.96.0 test --locked --offline --manifest-path experiments/native-compiler/Cargo.toml
          cargo +1.96.0 build --release --offline --locked --manifest-path experiments/native-compiler/Cargo.toml
          python3 experiments/native-compiler/tests/conformance.py
          python3 experiments/native-compiler/tests/differential.py
          python3 experiments/native-compiler/tests/comparison.py
          python3 scripts/check-borrow-sanitizers.py --native experiments/native-compiler/target/release/talven-native
      - name: Compare verified overlapping native and reference workloads
        if: matrix.native
        run: python3 scripts/measure-native-prototype.py --native experiments/native-compiler/target/release/talven-native --expect-arch '${{ matrix.arch }}' --out build/native-comparison --repetitions 3 --warmups 1 --environment-note 'GitHub Actions shared runner; Rust 1.96.0 Cargo release defaults recorded in manifest'
      - name: Measure verified native in-process frontend and emission phases
        if: matrix.native
        run: python3 scripts/measure-native-inprocess.py --native experiments/native-compiler/target/release/talven-native --expect-arch '${{ matrix.arch }}' --out build/native-phase-baseline --repetitions 20 --warmups 2 --environment-note 'GitHub Actions shared runner; native std::time::Instant; source I/O and C builds excluded from core timings'
      - name: Preserve native phase evidence
        if: always() && matrix.native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-phase-baseline-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/native-phase-baseline/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native comparison evidence
        if: always() && matrix.native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-comparison-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/native-comparison/
          if-no-files-found: error
          retention-days: 30
      - name: Measure offline tooling with correctness gates
        run: python3 scripts/measure-tooling.py --expect-arch '${{ matrix.arch }}' --out build/tooling-baseline --repetitions 3 --warmups 1 --environment-note 'GitHub Actions shared runner; checkout on runner filesystem'
      - name: Preserve tooling baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tooling-baseline-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/tooling-baseline/
          if-no-files-found: error
          retention-days: 30
      - name: Compare persistent and full function checking over verified edits
        env:
          LC_ALL: C
          PYTHONHASHSEED: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/measure-incremental.py --expect-arch '${{ matrix.arch }}' --out build/incremental-comparison --repetitions 3 --warmups 1 --environment-note 'GitHub Actions shared runner; in-process reference checks; verification outside timing'
      - name: Preserve persistent checking evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incremental-comparison-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/incremental-comparison/
          if-no-files-found: error
          retention-days: 30
      - name: Verify current call type contract checks against full analysis
        run: python3 scripts/measure-incremental.py --expect-arch '${{ matrix.arch }}' --out build/call-type-contracts --repetitions 1 --warmups 0 --call-type-contracts --environment-note 'GitHub Actions shared runner; explicit call type contracts; current full analysis/context/C and untimed native acceptance'
      - name: Preserve call type checking evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: call-type-contracts-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/call-type-contracts/
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact body grammar reuse against full analysis
        run: python3 scripts/measure-incremental.py --expect-arch '${{ matrix.arch }}' --out build/body-syntax --repetitions 1 --warmups 0 --call-type-contracts --reuse-body-syntax --environment-note 'GitHub Actions shared runner; full current lexing/declarations, exact body grammar; current analysis/context/C and untimed native acceptance'
      - name: Preserve body syntax evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: body-syntax-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/body-syntax/
          if-no-files-found: error
          retention-days: 30
      - name: Compare current full builds and private object reuse with native acceptance
        run: python3 scripts/measure-unit-rebuilds.py --expect-arch '${{ matrix.arch }}' --out build/unit-rebuild-comparison --repetitions 1 --warmups 0 --timeout 60 --stable-toolchain --environment-note 'GitHub Actions shared runner; trusted fixed job toolchain; in-process current builds, actual-object native acceptance outside timing'
      - name: Preserve private object rebuild evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-rebuild-comparison-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/unit-rebuild-comparison/
          if-no-files-found: error
          retention-days: 30
      - name: Measure actual native watcher edits with current task acceptance
        run: python3 scripts/measure-native-watch.py --expect-arch '${{ matrix.arch }}' --out build/native-watch-baseline --repetitions 1 --warmups 0 --timeout 60 --stable-toolchain --environment-note 'GitHub Actions shared runner; actual full/native watcher sessions; 50 ms polling and 100 ms debounce; terminal receipts are not application readiness'
      - name: Preserve native watcher edit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-watch-baseline-${{ matrix.arch }}-python-${{ matrix.python }}
          path: build/native-watch-baseline/
          if-no-files-found: error
          retention-days: 30
      - name: Verify local-contract object rebuilds and actual watcher edits
        run: |
          python3 scripts/measure-unit-rebuilds.py --expect-arch '${{ matrix.arch }}' --out build/local-contract-rebuilds --repetitions 1 --warmups 0 --timeout 60 --stable-toolchain --local-contracts --environment-note 'GitHub Actions shared runner; explicit local contracts; actual-object native acceptance'
          python3 scripts/measure-native-watch.py --expect-arch '${{ matrix.arch }}' --out build/local-contract-watch --repetitions 1 --warmups 0 --timeout 60 --stable-toolchain --local-contracts --environment-note 'GitHub Actions shared runner; explicit local contracts; actual watcher native acceptance'
      - name: Preserve local-contract native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-contracts-${{ matrix.arch }}-python-${{ matrix.python }}
          path: |
            build/local-contract-rebuilds/
            build/local-contract-watch/
          if-no-files-found: error
          retention-days: 30
