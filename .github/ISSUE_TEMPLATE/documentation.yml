name: Documentation issue
description: Report an error, inconsistency, broken link, or unclear passage in the design documents
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File and section
      placeholder: docs/security.md, "Capabilities and effects"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional. Small fixes are welcome directly as a pull request.
