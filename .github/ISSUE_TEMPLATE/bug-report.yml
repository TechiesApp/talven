name: Compiler or tooling bug
description: Wrong diagnostic, crash, bad generated code, or unexpected CLI/LSP behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: source
    attributes:
      label: Smallest program that shows the problem
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python3 -m talven check bug.tal --json
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened and what you expected
      description: Include the full output or diagnostic.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 arm64, Python 3.12, Apple clang 17, commit abc1234
    validations:
      required: true
